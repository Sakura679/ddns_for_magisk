name: Auto-tag module version

on:
  push:
    branches:
      - main

jobs:
  tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # needed to get tags and history

      - name: Extract version from module.prop
        id: version
        run: |
          VERSION=$(grep '^version=' module.prop | cut -d'=' -f2)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Find last commit that changed module.prop
        id: commit
        run: |
          COMMIT=$(git log -n 1 --pretty=format:%H -- module.prop)
          echo "commit=$COMMIT" >> $GITHUB_OUTPUT

      - name: Debug: list tags
        run: |
          echo "Tags in repository:"
          git tag -l | head -20

      - name: Create and push tag (force)
        env:
          PAT: ${{ secrets.PAT }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          TAG="v${{ steps.version.outputs.version }}"
          COMMIT="${{ steps.commit.outputs.commit }}"
          # Overwrite the tag locally if it exists, pointing to the correct commit
          git tag -f "$TAG" "$COMMIT"
          # Use PAT for pushing to avoid triggering workflows with GITHUB_TOKEN
          remote_repo="https://x-access-token:${PAT}@github.com/${{ github.repository }}.git"
          git push -f "$remote_repo" "$TAG"